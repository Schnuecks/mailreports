# Example setup. Copy .env.example to .env and adjust it, put the IMAP password into
# ./secrets/imap_password.txt and the password for signing in to the page into
# ./secrets/admin_password.txt (or its hash from `python -m mailreports hash-password`),
# then start with: docker compose up -d
services:
  mailreports:
    image: ghcr.io/schnuecks/mailreports:latest
    container_name: mailreports
    restart: unless-stopped
    env_file: .env
    environment:
      IMAP_PASSWORD_FILE: /run/secrets/imap_password
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SOURCES_FILE: /config/sources.toml
    secrets:
      - imap_password
      - admin_password
    volumes:
      - ./data:/data
      - ./sources.toml:/config/sources.toml:ro
      # optional: MaxMind GeoLite2 databases (GeoLite2-City/-Country/-ASN.mmdb)
      # - /path/to/geoip:/geoip:ro
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

secrets:
  imap_password:
    file: ./secrets/imap_password.txt
  admin_password:
    file: ./secrets/admin_password.txt
