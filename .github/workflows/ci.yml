name: CI

# Pull requests and version tags run everything: linter (Ruff), translation check, tests,
# image build for all platforms and a Trivy scan for known vulnerabilities.
# A push to main is almost always the squash of a PR that was just checked: only the linter
# and tests run there as a safety net.
# For pull requests the image is only test-built (not uploaded). It is uploaded for a
# version tag (v1.2.3); afterwards the last five releases are kept (KEEP_VERSIONS).
# A test build (v1.2.3-rc.1) is uploaded under its own tag only, never as "latest".

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  PLATFORMS: linux/amd64,linux/arm64
  # per release 1 index + 1 image per platform (2 platforms = 3 versions), 5 releases = 15
  KEEP_VERSIONS: 15

jobs:
  changes:
    # Only docs changed (Markdown, docs/, licence, issue templates)? Then tests, browser test and
    # image are skipped; GitHub counts skipped required checks as passed. Tags always run everything.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ "$GITHUB_REF_TYPE" != tag ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD | grep -qvE '\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/' || code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check
      - run: python tools/i18n_extract.py
      - run: python -m pytest -q
      - name: Tag matches __version__
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import mailreports; print(mailreports.__version__)")
          # a test build like v1.2.0-rc.1 belongs to version 1.2.0
          test "v$version" = "${GITHUB_REF_NAME%%-*}" || { echo "tag $GITHUB_REF_NAME != __version__ $version"; exit 1; }

  image:
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: contains(env.PLATFORMS, 'arm')
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: release
        run: echo "push=${{ startsWith(github.ref, 'refs/tags/v') }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.release.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ steps.release.outputs.push == 'true' && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.release.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Security scan: load the amd64 image from the cache
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mailreports:scan
          provenance: false
          sbom: false
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp -p 8080:8080 -e ADMIN_PASSWORD=smoke-test-password mailreports:scan
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 303   # sign-in required
          curl -fsS http://127.0.0.1:8080/login > /dev/null
          docker logs smoke
          docker rm -f smoke
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mailreports:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mailreports:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true

  dependabot-merge:
    # Merges Dependabot proposals for patch and minor updates once all checks are green.
    needs: [test, image]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge patch and minor updates
        # Docker base images: only digest rebuilds and patch updates of the same version.
        # A new minor or major version (e.g. Python 3.14 -> 3.15) stays open until the
        # tests cover it.
        if: >-
          (steps.meta.outputs.package-ecosystem != 'docker'
            && (steps.meta.outputs.update-type == 'version-update:semver-patch'
              || steps.meta.outputs.update-type == 'version-update:semver-minor'))
          || (steps.meta.outputs.package-ecosystem == 'docker'
            && steps.meta.outputs.update-type != 'version-update:semver-minor'
            && steps.meta.outputs.update-type != 'version-update:semver-major')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"

  cleanup:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: ${{ env.KEEP_VERSIONS }}
